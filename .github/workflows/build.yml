name: Build Repan4 EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-repan4:
    runs-on: windows-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Compile C++ menjadi EXE
        run: g++ -static "repan4.cpp" -o "repan4.exe"

      - name: Upload file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-repan4
          path: "repan4.exe"
